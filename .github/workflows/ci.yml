name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run environment check
      run: |
        python scripts/healthcheck.py

    - name: Run test suite
      run: |
        pytest -v --durations=10

    - name: Verify ingestion and indexing pipeline
      run: |
        python scripts/download_docs.py
        python scripts/ingest.py
        python scripts/build_index.py --recreate
        python scripts/build_bm25.py
        python scripts/search_dense.py "validate query parameters"
        python scripts/search_hybrid.py "OAuth2 authentication tokens"

    - name: Run benchmark evaluation
      run: |
        python scripts/run_eval.py
